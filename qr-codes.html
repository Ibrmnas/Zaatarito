<!DOCTYPE html>
<html>
<head>
    <title>Zaatarito - Table QR Codes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1c20;
            color: #fff;
            padding: 20px;
        }
        h1 {
            color: #facc15;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .info {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .qr-card {
            background: #2b2f36;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #4a505b;
        }
        .qr-card img {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            background: white;
            padding: 10px;
        }
        .qr-card .table-label {
            color: #facc15;
            font-weight: 700;
            margin-top: 10px;
            font-size: 1.1rem;
        }
        .qr-card .table-url {
            color: #94a3b8;
            font-size: 0.7rem;
            word-break: break-all;
            margin-top: 5px;
        }
        .print-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 30px;
            background: #facc15;
            color: #1a1c20;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .print-btn:hover {
            background: #eab308;
        }
        @media print {
            .print-btn, .info { display: none !important; }
            body { background: white; }
            h1 { color: #333; }
            .qr-card { background: #f5f5f5; border-color: #ddd; }
            .qr-card .table-label { color: #333; }
            .qr-card img { max-width: 150px; height: auto; }
            .qr-card .table-url { color: #666; }
        }
    </style>
</head>
<body>
    <h1>📱 Zaatarito - Table QR Codes</h1>
    <p class="info">Scan the code on the table to start ordering. Redirecting to https://zaatarito.onrender.com</p>
    <button class="print-btn" onclick="window.print()">🖨️ Print All QR Codes</button>
    <div class="qr-grid" id="qrGrid"></div>
    
    <script>
        const tableCount = 20;
        const baseUrl = "https://zaatarito.onrender.com/?table=";
        const qrGrid = document.getElementById('qrGrid');
        
        for (let i = 1; i <= tableCount; i++) {
            const card = document.createElement('div');
            card.className = 'qr-card';
            
            // Use a FREE API to generate the QR code image
            const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(baseUrl + i)}`;
            
            card.innerHTML = `
                <img src="${qrImgUrl}" alt="Table ${i} QR Code" />
                <div class="table-label">🍽️ Table #${i}</div>
                <div class="table-url">Scan to order: ${baseUrl}${i}</div>
            `;
            qrGrid.appendChild(card);
        }
    </script>
</body>
</html>
