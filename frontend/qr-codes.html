<!DOCTYPE html>
<html>
<head>
    <title>Zaatarito - Table QR Codes</title>
    <!-- Load a different QR code library (unpkg CDN) -->
    <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1c20;
            color: #fff;
            padding: 20px;
        }
        h1 {
            color: #facc15;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .info {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .qr-card {
            background: #2b2f36;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #4a505b;
        }
        .qr-card .qr-code-container {
            background: white;
            padding: 10px;
            border-radius: 8px;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-card .table-label {
            color: #facc15;
            font-weight: 700;
            margin-top: 10px;
            font-size: 1.1rem;
        }
        .qr-card .table-url {
            color: #94a3b8;
            font-size: 0.7rem;
            word-break: break-all;
            margin-top: 5px;
        }
        .print-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 30px;
            background: #facc15;
            color: #1a1c20;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .print-btn:hover {
            background: #eab308;
        }
        .error-msg {
            display: none;
            color: #ff6b6b;
            text-align: center;
            margin: 20px 0;
            font-size: 1rem;
        }
        @media print {
            .print-btn, .info, .error-msg { display: none !important; }
            body { background: white; }
            h1 { color: #333; }
            .qr-card { background: #f5f5f5; border-color: #ddd; }
            .qr-card .table-label { color: #333; }
            .qr-card .qr-code-container { width: 150px; height: 150px; }
            .qr-card .table-url { color: #666; }
        }
    </style>
</head>
<body>
    <h1>📱 Zaatarito - Table QR Codes</h1>
    <p class="info">Scan the code on the table to start ordering. Redirecting to https://zaatarito.onrender.com</p>
    <button class="print-btn" onclick="window.print()">🖨️ Print All QR Codes</button>
    
    <div class="error-msg" id="errorMsg">⚠️ Error: The QR code library failed to load. Please check your internet connection and refresh the page.</div>
    
    <div class="qr-grid" id="qrGrid"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tableCount = 20;
            const baseUrl = "https://zaatarito.onrender.com/?table=";
            const qrGrid = document.getElementById('qrGrid');

            // Check if the library actually loaded
            if (typeof QRCode === 'undefined') {
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            for (let i = 1; i <= tableCount; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                
                // Create container for QR code
                const qrContainer = document.createElement('div');
                qrContainer.className = 'qr-code-container';
                
                // Create a div for the QR code to be injected into
                const qrDiv = document.createElement('div');
                qrDiv.id = `qr-${i}`;
                qrContainer.appendChild(qrDiv);
                
                // Add other text elements
                const label = document.createElement('div');
                label.className = 'table-label';
                label.textContent = `🍽️ Table #${i}`;
                
                const url = document.createElement('div');
                url.className = 'table-url';
                url.textContent = `Scan to order: ${baseUrl}${i}`;
                
                card.appendChild(qrContainer);
                card.appendChild(label);
                card.appendChild(url);
                
                qrGrid.appendChild(card);
                
                // Generate the QR code using the library
                new QRCode(document.getElementById(`qr-${i}`), {
                    text: `${baseUrl}${i}`,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        });
    </script>
</body>
</html>
