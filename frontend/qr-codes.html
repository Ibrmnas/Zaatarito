<!DOCTYPE html>
<html>
<head>
    <title>Zaatarito - Table QR Codes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1c20;
            color: #fff;
            padding: 20px;
        }
        h1 {
            color: #facc15;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .info {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .qr-card {
            background: #2b2f36;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #4a505b;
        }
        .qr-card canvas {
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .qr-card .table-label {
            color: #facc15;
            font-weight: 700;
            margin-top: 10px;
            font-size: 1.1rem;
        }
        .qr-card .table-url {
            color: #94a3b8;
            font-size: 0.7rem;
            word-break: break-all;
            margin-top: 5px;
        }
        .print-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 30px;
            background: #facc15;
            color: #1a1c20;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .print-btn:hover {
            background: #eab308;
        }
        @media print {
            .print-btn, .info { display: none !important; }
            body { background: white; }
            h1 { color: #333; }
            .qr-card { background: #f5f5f5; border-color: #ddd; }
            .qr-card .table-label { color: #333; }
            .qr-card canvas { width: 150px; height: 150px; padding: 5px; }
            .qr-card .table-url { color: #666; }
        }
    </style>
</head>

                function mapData(data, maskPattern) { var inc = -1; var row = _moduleCount - 1; var bitIndex = 7; var byteIndex = 0; for (var col = _moduleCount - 1; col > 0; col -= 2) { if (col == 6) col--; while (true) { for (var c = 0; c < 2; c++) { if (_modules[row][col - c] == null) { var dark = false; if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1); var mask = QRUtil.getMask(maskPattern, row, col - c); if (mask) dark = !dark; _modules[row][col - c] = dark; bitIndex--; if (bitIndex == -1) { byteIndex++; bitIndex = 7; } } } row += inc; if (row < 0 || _moduleCount <= row) { row -= inc; inc = -inc; break; } } } }
                // UTF-8 support
                if (typeof String.prototype.utf8Encode == 'undefined') {

        // ==========================================
        // GENERATE THE QR CODES
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            const tableCount = 20;
            const baseUrl = "https://zaatarito.onrender.com/?table=";
            const qrGrid = document.getElementById('qrGrid');

            for (let i = 1; i <= tableCount; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                
                // Create canvas element for QR code
                const canvas = document.createElement('canvas');
                canvas.id = `qr-${i}`;
                canvas.width = 180;
                canvas.height = 180;
                canvas.style.width = '160px';
                canvas.style.height = '160px';
                
                // Generate QR code
                const qr = qrcode.create(0, 'M');
                qr.addData(`${baseUrl}${i}`);
                qr.make();
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#000000';
                
                const moduleCount = qr.getModuleCount();
                const moduleSize = canvas.width / moduleCount;
                
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect(col * moduleSize, row * moduleSize, moduleSize, moduleSize);
                        }
                    }
                }
                
                // Add text elements
                const label = document.createElement('div');
                label.className = 'table-label';
                label.textContent = `🍽️ Table #${i}`;
                
                const url = document.createElement('div');
                url.className = 'table-url';
                url.textContent = `Scan to order: ${baseUrl}${i}`;
                
                card.appendChild(canvas);
                card.appendChild(label);
                card.appendChild(url);
                
                qrGrid.appendChild(card);
            }
        });
    </script>
