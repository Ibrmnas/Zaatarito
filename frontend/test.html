<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
    <script src="translations.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <h1>Testing...</h1>
    <div id="test"></div>
    <script>
        // Check if translations loaded
        if (typeof translations !== 'undefined') {
            document.getElementById('test').innerHTML = '✅ translations loaded!';
        } else {
            document.getElementById('test').innerHTML = '❌ translations NOT loaded!';
        }
        
        // Check if menuSections loaded
        if (typeof menuSections !== 'undefined') {
            document.getElementById('test').innerHTML += '<br>✅ menuSections loaded! (' + menuSections.length + ' sections)';
        } else {
            document.getElementById('test').innerHTML += '<br>❌ menuSections NOT loaded!';
        }
    </script>
</body>
</html>
